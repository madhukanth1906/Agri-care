<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgriCare - AI Farming Assistant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 text-gray-800">

    <!-- Simple Login Page -->
    <div id="auth-container">
        <div id="login-page" class="min-h-screen flex items-center justify-center bg-green-50/50 p-4">
            <div class="w-full max-w-sm p-8 space-y-6 bg-white rounded-2xl shadow-xl">
                <div class="text-center">
                    <i class="fas fa-leaf text-5xl text-green-600"></i>
                    <h2 class="mt-4 text-3xl font-bold text-gray-900">Welcome to AgriCare</h2>
                    <p class="mt-2 text-sm text-gray-600">Your AI Farming Assistant</p>
                </div>
                <form id="login-form" class="mt-8 space-y-6">
                    <div class="space-y-4">
                        <div>
                            <label for="username" class="block text-sm font-medium text-gray-700 mb-1">Username or Email</label>
                            <input id="username" name="username" type="text" required class="block w-full px-4 py-3 border border-gray-300 rounded-md focus:outline-none focus:ring-green-500 focus:border-green-500">
                        </div>
                        <div>
                            <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                            <input id="password" name="password" type="password" required class="block w-full px-4 py-3 border border-gray-300 rounded-md focus:outline-none focus:ring-green-500 focus:border-green-500">
                        </div>
                    </div>
                    <button type="submit" class="w-full flex justify-center py-3 px-4 text-sm font-medium rounded-md text-white bg-green-600 hover:bg-green-700 transition-colors">Sign In</button>
                </form>
                <div class="text-center">
                    <button id="skip-auth" class="bg-blue-600 text-white px-4 py-2 rounded">Skip to Main App (Test)</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Main App (Hidden by default) -->
    <div id="main-app" class="hidden">
        <header class="bg-white shadow-sm">
            <div class="container mx-auto px-4 py-3 flex justify-between items-center">
                <div class="flex items-center space-x-3">
                    <i class="fas fa-leaf text-3xl text-green-600"></i>
                    <h1 class="text-2xl font-bold text-gray-800">AgriCare</h1>
                </div>
            </div>
        </header>

        <main class="container mx-auto p-4">
            <div id="main-menu">
                <h2 class="text-2xl font-bold text-center mb-8">What would you like to do today?</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 max-w-6xl mx-auto">
                    <button type="button" id="menu-weather" class="bg-white p-6 rounded-lg shadow-lg hover:shadow-xl transition text-center">
                        <i class="fas fa-cloud-sun text-5xl text-amber-500 mb-4"></i>
                        <h3 class="text-xl font-semibold">Local Weather</h3>
                    </button>
                    <button type="button" id="menu-disease" class="bg-white p-6 rounded-lg shadow-lg hover:shadow-xl transition text-center">
                        <i class="fas fa-bug text-5xl text-red-500 mb-4"></i>
                        <h3 class="text-xl font-semibold">Crop Health Check</h3>
                    </button>
                    <button type="button" id="menu-yield" class="bg-white p-6 rounded-lg shadow-lg hover:shadow-xl transition text-center">
                        <i class="fas fa-chart-line text-5xl text-lime-600 mb-4"></i>
                        <h3 class="text-xl font-semibold">Yield Prediction</h3>
                    </button>
                    <button type="button" id="menu-chatbot" class="bg-white p-6 rounded-lg shadow-lg hover:shadow-xl transition text-center">
                        <i class="fas fa-robot text-5xl text-blue-500 mb-4"></i>
                        <h3 class="text-xl font-semibold">AgriBot Assistant</h3>
                    </button>
                </div>
            </div>

            <!-- Weather View -->
            <div id="weather-view" class="hidden">
                <h2 class="text-2xl font-bold mb-4">Weather Information</h2>
                <div class="bg-white p-6 rounded-lg shadow-lg">
                    <p class="text-lg">Weather data will be displayed here.</p>
                    <button id="back-to-menu" class="mt-4 bg-green-600 text-white px-4 py-2 rounded">Back to Menu</button>
                </div>
            </div>

            <!-- Other views would go here -->
        </main>
    </div>

    <script>
        console.log('🚀 Simple AgriCare app starting...');
        
        // Skip auth button
        document.getElementById('skip-auth').addEventListener('click', function() {
            console.log('🎯 Skipping to main app');
            document.getElementById('auth-container').classList.add('hidden');
            document.getElementById('main-app').classList.remove('hidden');
        });

        // Menu buttons
        document.getElementById('menu-weather').addEventListener('click', function() {
            console.log('🌤️ Weather clicked');
            document.getElementById('main-menu').classList.add('hidden');
            document.getElementById('weather-view').classList.remove('hidden');
        });

        document.getElementById('back-to-menu').addEventListener('click', function() {
            console.log('🏠 Back to menu');
            document.getElementById('weather-view').classList.add('hidden');
            document.getElementById('main-menu').classList.remove('hidden');
        });

        console.log('✅ Simple app initialized');
    </script>
</body>
</html>
